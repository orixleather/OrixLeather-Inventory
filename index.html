<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orix Leather Inventory</title>
<style>
:root{--bg:#120a10;--panel:#201119;--line:#44232f;--gold:#f0b866;--gold2:#d9854e;--text:#fbf1e6;--mute:#b9a0a1;--bad:#ff7f7f;--ok:#8fd6a0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 520px at 88% -8%,#431a2c 0,transparent 62%),radial-gradient(700px 400px at -5% 105%,#2b1530 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font-family:'Nirmala UI','Noto Sans Bengali','Segoe UI',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav{width:210px;background:#0d070b;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:34px;height:calc(100vh - 34px);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:20px;background:linear-gradient(90deg,#ffe2a8,#f0b866 45%,#d9854e);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em;padding:4px 10px 16px}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--mute);cursor:pointer}
nav button.on,nav button:hover{background:linear-gradient(90deg,#4a2233,#2a1420);color:var(--gold)}nav button.on{box-shadow:inset 3px 0 0 var(--gold)}
nav .sp{flex:1}
main{flex:1;padding:22px;max-width:1100px;min-width:0}
h2{margin:0 0 16px;font-weight:600;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:linear-gradient(160deg,#2a1520,var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px}
.card small{color:var(--mute);display:block}
.card b{font-size:23px;font-weight:700;background:linear-gradient(90deg,#ffe2a8,#f0b866);-webkit-background-clip:text;background-clip:text;color:transparent}.card b.bad{background:none;color:var(--bad)}.grid .card{border-top:2px solid var(--gold)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:13px}
.wrap{overflow-x:auto}
.btn{background:linear-gradient(135deg,#ffd98e,#e08f4f);color:#2a1206;box-shadow:0 4px 14px #e08f4f33;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:13px}
input,select,textarea{background:#150a11;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.mute{color:var(--mute)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:9}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:640px}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.lock{max-width:320px;margin:15vh auto;text-align:center;padding:20px}
.stk input{width:64px;padding:5px}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.brand,nav .sp{display:none}nav button{white-space:nowrap}main{padding:14px}}
.tick{position:sticky;top:0;z-index:8;height:34px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#3d1627,#6a2640,#3d1627);border-bottom:1px solid var(--gold);color:#ffe2a8;font-weight:600}
.tk{display:inline-block;padding-left:100%;animation:mq 32s linear infinite}
.tick:hover .tk{animation-play-state:paused}
.tedit{position:absolute;right:0;top:0;height:100%;border:0;background:#3d1627;color:var(--gold);padding:0 12px;cursor:pointer}
@keyframes mq{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tk{animation:none;padding-left:12px}}
@media(max-width:760px){nav{top:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const T={
dash:['ড্যাশবোর্ড','Dashboard'],prod:['পণ্য ও স্টক','Products & Stock'],ord:['অর্ডার','Orders'],exp:['খরচ','Expenses'],bak:['ব্যাকআপ','Backup'],
sales:['মোট বিক্রয়','Total sales'],profit:['নেট লাভ','Net profit'],orders:['মোট অর্ডার','Total orders'],stockn:['স্টকে জোড়া','Pairs in stock'],
stockv:['স্টক ভ্যালু','Stock value'],cdue:['কুরিয়ারে আটকে','Courier due'],low:['কম স্টক','Low stock'],none:['কিছু নেই','Nothing yet'],
add:['যোগ করুন','Add'],save:['সংরক্ষণ','Save'],cancel:['বাতিল','Cancel'],del:['মুছুন','Delete'],edit:['স্টক','Stock'],
name:['নাম','Name'],code:['কোড','Code'],cat:['ক্যাটাগরি','Category'],cost:['ক্রয়মূল্য','Cost'],price:['বিক্রয়মূল্য','Price'],
colors:['কালার (কমা দিয়ে)','Colors (comma)'],sizes:['সাইজ (কমা দিয়ে)','Sizes (comma)'],total:['মোট','Total'],
cust:['কাস্টমার','Customer'],phone:['মোবাইল','Phone'],addr:['ঠিকানা','Address'],src:['সোর্স','Source'],courier:['কুরিয়ার','Courier'],
qty:['পরিমাণ','Qty'],disc:['ডিসকাউন্ট','Discount'],dch:['ডেলিভারি চার্জ','Delivery charge'],status:['স্ট্যাটাস','Status'],
size:['সাইজ','Size'],color:['কালার','Color'],amount:['টাকা','Amount'],note:['নোট','Note'],date:['তারিখ','Date'],
pin:['পিন দিন','Enter PIN'],setpin:['নতুন পিন সেট করুন','Set a new PIN'],open:['খুলুন','Unlock'],wrong:['ভুল পিন','Wrong PIN'],
exportb:['ব্যাকআপ ডাউনলোড (JSON)','Download backup (JSON)'],importb:['ব্যাকআপ রিস্টোর','Restore backup'],
exportc:['অর্ডার CSV (Excel)','Orders CSV (Excel)'],bnote:['ডেটা এই ব্রাউজারে সংরক্ষিত থাকে। নিয়মিত ব্যাকআপ নিন।','Data is stored in this browser. Take regular backups.'],
lock:['লক করুন','Lock'],profitO:['লাভ','Profit'],nostock:['স্টক নেই','Out of stock'],
New:['নতুন','New'],Confirmed:['কনফার্মড','Confirmed'],Shipped:['শিপড','Shipped'],Delivered:['ডেলিভারড','Delivered'],Cancelled:['বাতিল','Cancelled'],Returned:['রিটার্ন','Returned'],
Packaging:['প্যাকেজিং','Packaging'],Marketing:['মার্কেটিং','Marketing'],Courier:['কুরিয়ার','Courier'],Office:['অফিস','Office'],Other:['অন্যান্য','Other']};
const ST=['New','Confirmed','Shipped','Delivered','Cancelled','Returned'];
const EC=['Packaging','Marketing','Courier','Office','Other'];
const K='orix_inventory_v1';
let L=localStorage.getItem('orix_lang')||'bn',page='dash',authed=false;
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(K))||{pin:null,products:[],orders:[],expenses:[]}}catch(e){return{pin:null,products:[],orders:[],expenses:[]}}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Storage error')}}
const t=k=>(T[k]||[k,k])[L==='bn'?0:1];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const bn=n=>'৳'+Math.round(n).toLocaleString(L==='bn'?'bn-BD':'en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const $=s=>document.querySelector(s);
const prod=id=>db.products.find(p=>p.id===id);
const pairs=p=>Object.values(p.stock||{}).reduce((a,b)=>a+num(b),0);
const oTotal=o=>num(o.price)*num(o.qty)-num(o.disc);
const oProfit=o=>oTotal(o)-num(o.cost)*num(o.qty);

const DEF_TICK='✦ ORIX LEATHER ✦ প্রিমিয়াম লেদার জুতা ✦ সঠিক সাইজ, সঠিক হিসাব ✦ প্রতিটি অর্ডার ও প্রতিটি টাকার হিসাব এক জায়গায় ✦ Premium Leather Footwear ✦';
const tick=()=>`<div class="tick"><span class="tk">${esc(db.marquee||DEF_TICK)}</span>${authed?`<button class="tedit" title="Edit" onclick="editTick()">✎</button>`:''}</div>`;
function editTick(){const v=prompt(L==='bn'?'মার্কুইয়ের লেখা লিখুন (ফাঁকা রাখলে ডিফল্ট):':'Marquee text (empty = default):',db.marquee||DEF_TICK);if(v===null)return;db.marquee=v.trim();save();render()}
function render(){
  const r=$('#root');
  if(!authed){
    r.innerHTML=tick()+`<div class="lock card"><div class="brand">ORIX LEATHER</div>
    <label>${db.pin?t('pin'):t('setpin')}<input id="pin" type="password" inputmode="numeric" autofocus></label>
    <button class="btn" onclick="login()">${t('open')}</button> <button class="btn ghost" onclick="switchLang()">${L==='bn'?'EN':'বাংলা'}</button>
    <p id="err" class="bad"></p></div>`;
    $('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});return;
  }
  const nav=['dash','prod','ord','exp','bak'].map(k=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('');
  r.innerHTML=tick()+`<div class="app"><nav><div class="brand">ORIX LEATHER</div>${nav}<div class="sp"></div>
  <button onclick="switchLang()">${L==='bn'?'English':'বাংলা'}</button><button onclick="authed=false;render()">${t('lock')}</button></nav>
  <main>${views[page]()}</main></div>`;
}
function login(){
  const v=$('#pin').value.trim();
  if(!db.pin){if(v.length<4){$('#err').textContent='4+';return}db.pin=v;save();authed=true;render();return}
  if(v===db.pin){authed=true;render()}else $('#err').textContent=t('wrong');
}
function switchLang(){L=L==='bn'?'en':'bn';localStorage.setItem('orix_lang',L);render()}
function go(p){page=p;render()}

const views={
dash(){
  const del=db.orders.filter(o=>o.status==='Delivered');
  const sales=del.reduce((a,o)=>a+oTotal(o),0);
  const gross=del.reduce((a,o)=>a+oProfit(o),0);
  const exp=db.expenses.reduce((a,e)=>a+num(e.amount),0);
  const sv=db.products.reduce((a,p)=>a+pairs(p)*num(p.cost),0);
  const due=db.orders.filter(o=>o.status==='Shipped').reduce((a,o)=>a+oTotal(o)+num(o.dch),0);
  const np=db.products.reduce((a,p)=>a+pairs(p),0);
  const lows=db.products.filter(p=>pairs(p)<=3);
  const cnt=ST.map(s=>`<span class="tag">${t(s)}: ${db.orders.filter(o=>o.status===s).length}</span>`).join(' ');
  return `<h2>${t('dash')}</h2><div class="grid">
  <div class="card"><small>${t('sales')}</small><b>${bn(sales)}</b></div>
  <div class="card"><small>${t('profit')}</small><b class="${gross-exp<0?'bad':''}">${bn(gross-exp)}</b></div>
  <div class="card"><small>${t('orders')}</small><b>${db.orders.length}</b></div>
  <div class="card"><small>${t('stockn')}</small><b>${np}</b></div>
  <div class="card"><small>${t('stockv')}</small><b>${bn(sv)}</b></div>
  <div class="card"><small>${t('cdue')}</small><b>${bn(due)}</b></div></div>
  <div class="card" style="margin-bottom:12px">${cnt}</div>
  <div class="card"><b style="font-size:16px">${t('low')}</b><br>${lows.length?lows.map(p=>`${esc(p.name)} (${esc(p.code)}): <span class="bad">${pairs(p)}</span>`).join('<br>'):`<span class="mute">${t('none')}</span>`}</div>`;
},
prod(){
  const rows=db.products.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}<br><small class="mute">${esc(p.cat)}</small></td>
  <td>${bn(p.cost)}</td><td>${bn(p.price)}</td><td class="${pairs(p)<=3?'bad':''}">${pairs(p)}</td>
  <td><button class="btn sm" onclick="stockForm('${p.id}')">${t('edit')}</button> <button class="btn sm ghost" onclick="delP('${p.id}')">${t('del')}</button></td></tr>`).join('');
  return `<div class="bar"><h2>${t('prod')}</h2><button class="btn" onclick="prodForm()">+ ${t('add')}</button></div>
  <div class="card wrap"><table><tr><th>${t('code')}</th><th>${t('name')}</th><th>${t('cost')}</th><th>${t('price')}</th><th>${t('total')}</th><th></th></tr>${rows||`<tr><td colspan=6>${t('none')}</td></tr>`}</table></div>`;
},
ord(){
  const rows=db.orders.slice().reverse().map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.cust)}<br><small class="mute">${esc(o.phone)}</small></td>
  <td>${esc(o.code)} · ${esc(o.color)} · ${esc(o.size)} ×${o.qty}</td><td>${bn(oTotal(o)+num(o.dch))}</td>
  <td class="${oProfit(o)<0?'bad':'ok'}">${bn(oProfit(o))}</td>
  <td><select onchange="setSt('${o.id}',this.value)">${ST.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${t(s)}</option>`).join('')}</select></td>
  <td><button class="btn sm ghost" onclick="delO('${o.id}')">${t('del')}</button></td></tr>`).join('');
  return `<div class="bar"><h2>${t('ord')}</h2><button class="btn" onclick="ordForm()">+ ${t('add')}</button></div>
  <div class="card wrap"><table><tr><th>${t('date')}</th><th>${t('cust')}</th><th>${t('prod')}</th><th>${t('total')}</th><th>${t('profitO')}</th><th>${t('status')}</th><th></th></tr>${rows||`<tr><td colspan=7>${t('none')}</td></tr>`}</table></div>`;
},
exp(){
  const tot=db.expenses.reduce((a,e)=>a+num(e.amount),0);
  const rows=db.expenses.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${t(e.cat)}</td><td>${esc(e.note)}</td><td>${bn(e.amount)}</td>
  <td><button class="btn sm ghost" onclick="delE('${e.id}')">${t('del')}</button></td></tr>`).join('');
  return `<div class="bar"><h2>${t('exp')} — ${bn(tot)}</h2><button class="btn" onclick="expForm()">+ ${t('add')}</button></div>
  <div class="card wrap"><table><tr><th>${t('date')}</th><th>${t('cat')}</th><th>${t('note')}</th><th>${t('amount')}</th><th></th></tr>${rows||`<tr><td colspan=5>${t('none')}</td></tr>`}</table></div>`;
},
bak(){
  return `<h2>${t('bak')}</h2><div class="card"><p>${t('bnote')}</p>
  <button class="btn" onclick="exportJ()">${t('exportb')}</button> <button class="btn ghost" onclick="exportC()">${t('exportc')}</button>
  <p><label>${t('importb')}<input type="file" accept=".json" onchange="importJ(this.files[0])"></label></p></div>`;
}};

function modal(h){const m=document.createElement('div');m.className='modal';m.id='m';m.innerHTML=`<div>${h}</div>`;document.body.appendChild(m)}
function closeM(){const m=$('#m');if(m)m.remove()}
const f=(id,label,v='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(v)}"></label>`;
const btns=fn=>`<div class="bar"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="${fn}">${t('save')}</button></div>`;
const val=id=>$('#'+id).value.trim();

function prodForm(){
  modal(`<h2>${t('add')} — ${t('prod')}</h2><div class="row">${f('pn',t('name'))}${f('pc',t('code'))}${f('pt',t('cat'),'Casual')}
  ${f('pcost',t('cost'),'','number')}${f('pp',t('price'),'','number')}${f('pcol',t('colors'),'Black, Brown')}${f('psz',t('sizes'),'39,40,41,42,43,44')}</div>${btns('saveProd()')}`);
}
function saveProd(){
  if(!val('pn')||!val('pc'))return;
  const colors=val('pcol').split(',').map(s=>s.trim()).filter(Boolean);
  const sizes=val('psz').split(',').map(s=>s.trim()).filter(Boolean);
  const stock={};colors.forEach(c=>sizes.forEach(s=>stock[c+'|'+s]=0));
  db.products.push({id:uid(),name:val('pn'),code:val('pc'),cat:val('pt'),cost:num(val('pcost')),price:num(val('pp')),colors,sizes,stock});
  save();closeM();render();stockForm(db.products[db.products.length-1].id);
}
function stockForm(id){
  closeM();const p=prod(id);
  const head=p.sizes.map(s=>`<th>${esc(s)}</th>`).join('');
  const body=p.colors.map(c=>`<tr><td>${esc(c)}</td>${p.sizes.map(s=>`<td class="stk"><input type="number" min="0" data-k="${esc(c)}|${esc(s)}" value="${num(p.stock[c+'|'+s])}"></td>`).join('')}</tr>`).join('');
  modal(`<h2>${esc(p.name)} — ${esc(p.code)}</h2><div class="wrap"><table><tr><th></th>${head}</tr>${body}</table></div>
  <div class="bar" style="margin-top:12px"><button class="btn ghost" onclick="closeM()">${t('cancel')}</button><button class="btn" onclick="saveStock('${id}')">${t('save')}</button></div>`);
}
function saveStock(id){
  const p=prod(id);document.querySelectorAll('#m input[data-k]').forEach(i=>p.stock[i.dataset.k]=Math.max(0,num(i.value)));
  save();closeM();render();
}
function delP(id){if(confirm(t('del')+'?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}

function ordForm(){
  if(!db.products.length){alert(t('prod')+'?');return}
  modal(`<h2>${t('add')} — ${t('ord')}</h2><div class="row">
  <label>${t('prod')}<select id="op" onchange="ordOpts()">${db.products.map(p=>`<option value="${p.id}">${esc(p.code)} — ${esc(p.name)}</option>`).join('')}</select></label>
  <label>${t('color')}<select id="oc"></select></label><label>${t('size')}<select id="os"></select></label>
  ${f('oq',t('qty'),1,'number')}${f('opr',t('price'),'','number')}${f('od',t('disc'),0,'number')}${f('odc',t('dch'),0,'number')}
  ${f('ocu',t('cust'))}${f('oph',t('phone'))}${f('oad',t('addr'))}${f('osr',t('src'),'Facebook')}${f('ocr',t('courier'),'Steadfast')}</div>${btns('saveOrd()')}`);
  ordOpts();
}
function ordOpts(){
  const p=prod($('#op').value);
  $('#oc').innerHTML=p.colors.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#os').innerHTML=p.sizes.map(s=>`<option>${esc(s)}</option>`).join('');
  $('#opr').value=p.price;
}
function saveOrd(){
  const p=prod(val('op')),c=val('oc'),s=val('os'),q=Math.max(1,num(val('oq'))),k=c+'|'+s;
  if(!val('ocu'))return;
  if(num(p.stock[k])<q&&!confirm(t('nostock')+'. OK?'))return;
  p.stock[k]=Math.max(0,num(p.stock[k])-q);
  db.orders.push({id:uid(),date:today(),pid:p.id,code:p.code,color:c,size:s,qty:q,price:num(val('opr')),disc:num(val('od')),dch:num(val('odc')),cost:p.cost,
    cust:val('ocu'),phone:val('oph'),addr:val('oad'),src:val('osr'),courier:val('ocr'),status:'New',restored:false});
  save();closeM();render();
}
function setSt(id,s){
  const o=db.orders.find(x=>x.id===id),p=prod(o.pid),k=o.color+'|'+o.size;o.status=s;
  const back=(s==='Cancelled'||s==='Returned');
  if(back&&!o.restored&&p){p.stock[k]=num(p.stock[k])+num(o.qty);o.restored=true}
  if(!back&&o.restored&&p){p.stock[k]=Math.max(0,num(p.stock[k])-num(o.qty));o.restored=false}
  save();render();
}
function delO(id){if(confirm(t('del')+'?')){db.orders=db.orders.filter(o=>o.id!==id);save();render()}}

function expForm(){
  modal(`<h2>${t('add')} — ${t('exp')}</h2><div class="row">${f('ed',t('date'),today(),'date')}
  <label>${t('cat')}<select id="ec">${EC.map(c=>`<option value="${c}">${t(c)}</option>`).join('')}</select></label>${f('ea',t('amount'),'','number')}${f('en',t('note'))}</div>${btns('saveExp()')}`);
}
function saveExp(){if(!num(val('ea')))return;db.expenses.push({id:uid(),date:val('ed'),cat:val('ec'),amount:num(val('ea')),note:val('en')});save();closeM();render()}
function delE(id){db.expenses=db.expenses.filter(e=>e.id!==id);save();render()}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportJ(){dl('orix-backup-'+today()+'.json',JSON.stringify(db),'application/json')}
function exportC(){
  const rows=[['Date','Customer','Phone','Address','Code','Color','Size','Qty','Total','Delivery','Courier','Status']];
  db.orders.forEach(o=>rows.push([o.date,o.cust,o.phone,o.addr,o.code,o.color,o.size,o.qty,oTotal(o),o.dch,o.courier,o.status]));
  dl('orix-orders.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
}
function importJ(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.orders)throw 0;if(confirm('Replace current data?')){db=d;save();render()}}catch(e){alert('Invalid file')}};
  r.readAsText(file);
}
render();
</script>
